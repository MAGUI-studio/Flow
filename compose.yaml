name: flow-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: flow
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - flow_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  flow_postgres:
